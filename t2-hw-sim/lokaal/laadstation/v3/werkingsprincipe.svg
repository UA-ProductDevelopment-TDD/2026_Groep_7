<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" width="1280" height="1100" role="img"><title>Axiaal schuivende laadkop — ontwerp ter goedkeuring</title><rect x="0" y="0" width="1280" height="1100" rx="0" fill="#f1f5f3" /><text x="38" y="54" fill="#173b47" font-family="Arial, sans-serif" font-size="37" font-weight="700">Laadkop op één langsrail</text><text x="40" y="86" fill="#173b47" font-family="Arial, sans-serif" font-size="19" font-weight="400">Principe v3  /  bovenaanzicht en zijaanzicht  /  ter goedkeuring</text><rect x="25" y="107" width="1230" height="534" rx="15" fill="white" /><text x="47" y="144" fill="#173b47" font-family="Arial, sans-serif" font-size="24" font-weight="700">Bovenaanzicht</text><text x="47" y="172" fill="#173b47" font-family="Arial, sans-serif" font-size="18" font-weight="400">De robot nadert van links. De volledige groene kop schuift op dezelfde as als de stekker.</text><rect x="55" y="266" width="122" height="174" rx="12" fill="#d6e6ea" /><text x="64" y="358" fill="#173b47" font-family="Arial, sans-serif" font-size="22" font-weight="700">Batterij</text><rect x="175" y="252" width="15" height="202" rx="3" fill="#173b47" /><rect x="186" y="276" width="78" height="12" rx="5" fill="#173b47" /><rect x="177" y="270" width="12" height="24" rx="2" fill="#e69b44" /><rect x="186" y="418" width="78" height="12" rx="5" fill="#173b47" /><rect x="177" y="412" width="12" height="24" rx="2" fill="#e69b44" /><path d="M78 477 H171 m-9 -5 9 5 -9 5" fill="none" stroke="#173b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><text x="61" y="505" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">Aanloop robot</text><path d="M300,197 L490,245 L729,245 L729,322 L491,322 L491,310 L576,289 L657,289 L657,275 L576,275 L491,253 L300,209 Z" fill="#88ccc1" stroke="#174c53" stroke-width="2" stroke-linejoin="round" /><path d="M300,209 L491,253 L576,275 L657,275" fill="none" stroke="#146958" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><path d="M491 268 V296" fill="none" stroke="#e69b44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" /><path d="M300,509 L490,461 L729,461 L729,384 L491,384 L491,396 L576,417 L657,417 L657,431 L576,431 L491,453 L300,497 Z" fill="#88ccc1" stroke="#174c53" stroke-width="2" stroke-linejoin="round" /><path d="M300,497 L491,453 L576,431 L657,431" fill="none" stroke="#146958" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><path d="M491 410 V438" fill="none" stroke="#e69b44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" /><rect x="686" y="322" width="43" height="62" rx="0" fill="#b9dfd7" /><rect x="521" y="342" width="51" height="22" rx="4" fill="#a9b8bd" /><rect x="563" y="327" width="115" height="52" rx="7" fill="#173b47" /><path d="M678 353 C745 353 758 346 782 325 S827 308 831 338 S849 384 898 371" fill="none" stroke="#173b47" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><path d="M642 343 H906 M642 363 H906" fill="none" stroke="#8b9b9e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path d="M754 273 H893 M754 273 l12 -7 M754 273 l12 7 M893 273 l-12 -7 M893 273 l-12 7" fill="none" stroke="#146958" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><text x="748" y="244" fill="#173b47" font-family="Arial, sans-serif" font-size="18" font-weight="700">Slag van de kop</text><text x="311" y="554" fill="#173b47" font-family="Arial, sans-serif" font-size="19" font-weight="700">Doorlopende geleideflank</text><path d="M410 533 L437 463" fill="none" stroke="#146958" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><text x="618" y="554" fill="#173b47" font-family="Arial, sans-serif" font-size="19" font-weight="700">USB-C in open U-goot</text><path d="M735 532 L688 390" fill="none" stroke="#173b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><text x="313" y="589" fill="#173b47" font-family="Arial, sans-serif" font-size="17" font-weight="400">Brede arm, taps pengat en korte eindboring sluiten op elkaar aan.</text><text x="313" y="615" fill="#173b47" font-family="Arial, sans-serif" font-size="17" font-weight="400">De smalle middenopening volgt de breedte van het stekkerhuis met stelruimte.</text><rect x="934" y="199" width="296" height="316" rx="12" fill="#f1f6f4" /><text x="952" y="232" fill="#173b47" font-family="Arial, sans-serif" font-size="20" font-weight="700">Inloop en sluiting</text><text x="952" y="266" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">1   De rail houdt de kop recht.</text><text x="952" y="294" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">     De buitenarmen corrigeren</text><text x="952" y="318" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">     de koers van de robot.</text><text x="952" y="357" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">2   De pennen lopen taps naar</text><text x="952" y="381" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">     de nauwe eindboringen.</text><text x="952" y="421" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">3   De magneten trekken de</text><text x="952" y="445" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">     kop het laatste stuk naar</text><text x="952" y="469" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">     links, naar de robot toe.</text><text x="940" y="556" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="700">Oranje = magneten onder</text><text x="940" y="579" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">de penassen, één paar per pen.</text><rect x="25" y="656" width="1230" height="417" rx="15" fill="white" /><text x="48" y="697" fill="#173b47" font-family="Arial, sans-serif" font-size="24" font-weight="700">Zijaanzicht</text><text x="49" y="727" fill="#173b47" font-family="Arial, sans-serif" font-size="18" font-weight="400">Alleen een dunne kop op batterijhoogte, met een korte slede eronder.</text><rect x="65" y="793" width="131" height="60" rx="9" fill="#d6e6ea" /><rect x="194" y="791" width="12" height="64" rx="2" fill="#173b47" /><rect x="202" y="801" width="75" height="8" rx="3" fill="#173b47" /><rect x="194" y="825" width="12" height="22" rx="0" fill="#e69b44" /><path d="M321 793 H677 V854 H321 Z" fill="#88ccc1" stroke="#174c53" stroke-width="2" stroke-linejoin="round" /><path d="M321 803 H436" fill="none" stroke="#173b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><rect x="320" y="824" width="14" height="23" rx="0" fill="#e69b44" /><rect x="304" y="807" width="28" height="8" rx="2" fill="#a7b8be" /><rect x="487" y="854" width="108" height="13" rx="3" fill="#398f80" /><rect x="414" y="867" width="265" height="11" rx="3" fill="#8b9b9e" /><rect x="411" y="859" width="9" height="19" rx="0" fill="#8b9b9e" /><rect x="674" y="857" width="9" height="21" rx="0" fill="#8b9b9e" /><path d="M414 886 H681 V905 H414 Z" fill="none" stroke="#8b9b9e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" /><text x="61" y="897" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">Batterijdeel</text><text x="291" y="776" fill="#173b47" font-family="Arial, sans-serif" font-size="17" font-weight="700">Dunne geleidearmen en kop</text><text x="440" y="933" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">Bevestiging op jullie eigen voet</text><path d="M475 916 L481 898" fill="none" stroke="#8b9b9e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><path d="M605 773 H671 m-10 -6 10 6 -10 6 M605 773 l10 -6 M605 773 l10 6" fill="none" stroke="#146958" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><text x="747" y="771" fill="#173b47" font-family="Arial, sans-serif" font-size="19" font-weight="700">Eén rechte rail met twee eindaanslagen</text><text x="747" y="801" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">De achterste aanslag vangt de duw tijdens het inlopen op.</text><text x="747" y="827" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">De voorste begrenst de slag bij het loslopen. De rail laat</text><text x="747" y="851" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">alleen beweging naar en van de robot toe.</text><text x="747" y="891" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">Stekkerhuis en trekontlasting bewegen mee. Een losse</text><text x="747" y="915" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">kabelbocht achter de kop geeft ruimte voor de slag.</text><path d="M48 961 H1228" fill="none" stroke="#d8e1de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /><text x="49" y="993" fill="#173b47" font-family="Arial, sans-serif" font-size="18" font-weight="700">Voorgestelde pasmaten</text><text x="49" y="1022" fill="#173b47" font-family="Arial, sans-serif" font-size="17" font-weight="400">Pen Ø3,3 mm   ·   eindboring Ø4,2 mm   ·   middenopening circa 11 mm voor een huis van 10 mm   ·   schijfmagneten Ø6 × 4 mm</text><text x="49" y="1049" fill="#173b47" font-family="Arial, sans-serif" font-size="16" font-weight="400">Kopdikte volgt de gemeten hoogte van het batterijdeel. Railslag en kracht voor de laatste millimeters worden op de proefopstelling bepaald.</text></svg>