<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="830" fill="#fbfaf7"/>

  <text x="20" y="32" font-size="20" font-weight="700" fill="#222">Magneet-dock v0 — conceptschets (geen maatvoering, ter controle)</text>
  <text x="20" y="52" fill="#666">Twee 3D-geprinte delen: robotdeel (oranje, op de batterij) en dockdeel (groen, met de USB-C-kabel). Rood = N, blauw = Z.</text>

  <!-- ============ PANEEL A: zijaanzicht geheel ============ -->
  <rect x="15" y="70" width="560" height="360" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="30" y="95" font-weight="700">A. Zijaanzicht: Bittle loopt het dock in</text>

  <!-- vloer -->
  <line x1="30" y1="390" x2="560" y2="390" stroke="#777" stroke-width="2"/>
  <!-- poten -->
  <g stroke="#555" stroke-width="7" stroke-linecap="round" fill="none">
    <polyline points="150,262 130,320 158,388"/>
    <polyline points="195,262 178,320 205,388"/>
    <polyline points="300,262 318,320 292,388"/>
    <polyline points="340,262 362,320 336,388"/>
  </g>
  <!-- lijf -->
  <rect x="120" y="222" width="250" height="44" rx="12" fill="#e9e9e9" stroke="#444" stroke-width="2"/>
  <text x="200" y="249" fill="#444">Bittle X (lijf)</text>
  <!-- kop -->
  <rect x="368" y="190" width="58" height="46" rx="14" fill="#e9e9e9" stroke="#444" stroke-width="2"/>
  <circle cx="410" cy="208" r="4" fill="#333"/>
  <!-- batterij -->
  <rect x="205" y="266" width="128" height="24" rx="4" fill="#cfd8dc" stroke="#444" stroke-width="1.5"/>
  <text x="228" y="283" font-size="12" fill="#333">batterij</text>
  <!-- robotdeel -->
  <rect x="333" y="258" width="20" height="40" rx="3" fill="#f39c3d" stroke="#8a4a00" stroke-width="1.5"/>
  <!-- dock -->
  <rect x="360" y="380" width="190" height="10" fill="#9ccc65" stroke="#33691e"/>
  <rect x="372" y="256" width="80" height="124" rx="4" fill="#9ccc65" stroke="#33691e" stroke-width="1.5"/>
  <path d="M452,330 C500,330 480,375 540,378" stroke="#222" stroke-width="4" fill="none"/>
  <text x="470" y="320" font-size="12" fill="#333">USB-C-kabel</text>
  <text x="470" y="335" font-size="12" fill="#333">naar lader</text>
  <!-- bewegingspijl -->
  <line x1="215" y1="205" x2="300" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="200" y="198" font-size="12" fill="#333">loopt vooruit (of achteruit)</text>
  <!-- labels -->
  <line x1="343" y1="258" x2="250" y2="150" stroke="#8a4a00"/>
  <text x="40" y="130" font-size="12" fill="#8a4a00">robotdeel: klemt rond het einde van de</text>
  <text x="40" y="145" font-size="12" fill="#8a4a00">batterij, met de USB-C-bus in het midden</text>
  <line x1="412" y1="256" x2="470" y2="140" stroke="#33691e"/>
  <text x="440" y="120" font-size="12" fill="#33691e">dockdeel: moet onder</text>
  <text x="440" y="135" font-size="12" fill="#33691e">de kop passen [ONBEKEND]</text>
  <text x="30" y="420" font-size="11.5" fill="#b00020">Positie en richting van de USB-C op de batterij: zelf meten en fotograferen [ONBEKEND]</text>

  <!-- ============ PANEEL B: doorsnede detail ============ -->
  <rect x="590" y="70" width="595" height="360" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="605" y="95" font-weight="700">B. Doorsnede (zijkant, vergroot, uit elkaar getrokken)</text>

  <!-- batterij-einde -->
  <rect x="605" y="160" width="45" height="160" fill="#cfd8dc" stroke="#444"/>
  <text x="600" y="380" font-size="11" fill="#333">batterij +</text>
  <text x="600" y="394" font-size="11" fill="#333">USB-C-bus</text>
  <!-- USB-C bus in batterij -->
  <rect x="632" y="231" width="18" height="18" fill="#fff" stroke="#333"/>
  <line x1="630" y1="370" x2="640" y2="250" stroke="#999" stroke-dasharray="2,3"/>

  <!-- robotdeel -->
  <path d="M650,150 H760 V330 H650 Z" fill="#f39c3d" stroke="#8a4a00" stroke-width="1.5"/>
  <!-- venster rond de bus -->
  <rect x="650" y="226" width="110" height="28" fill="#fff" stroke="#8a4a00" stroke-dasharray="3,2"/>
  <!-- trechter boven -->
  <polygon points="760,153 714,166 714,184 760,197" fill="#fff" stroke="#8a4a00"/>
  <rect x="702" y="168" width="12" height="14" fill="#e53935"/>
  <!-- trechter onder -->
  <polygon points="760,283 714,296 714,314 760,327" fill="#fff" stroke="#8a4a00"/>
  <rect x="702" y="298" width="12" height="14" fill="#1e88e5"/>
  <text x="655" y="145" font-size="12" fill="#8a4a00" font-weight="600">robotdeel</text>
  <text x="655" y="350" font-size="11" fill="#8a4a00">trechtergaten + magneet</text>
  <text x="655" y="364" font-size="11" fill="#8a4a00">onderin (Ø4×3 mm)</text>

  <!-- dockdeel -->
  <path d="M840,150 H990 V330 H840 Z" fill="#9ccc65" stroke="#33691e" stroke-width="1.5"/>
  <!-- pen boven -->
  <polygon points="840,157 797,169 797,181 840,193" fill="#9ccc65" stroke="#33691e"/>
  <rect x="797" y="168" width="12" height="14" fill="#1e88e5"/>
  <!-- pen onder -->
  <polygon points="840,287 797,299 797,311 840,323" fill="#9ccc65" stroke="#33691e"/>
  <rect x="797" y="298" width="12" height="14" fill="#e53935"/>
  <!-- stekker zwevend -->
  <rect x="842" y="220" width="52" height="40" fill="#fff" stroke="#33691e" stroke-dasharray="3,2"/>
  <rect x="846" y="224" width="44" height="32" rx="3" fill="#424242"/>
  <rect x="808" y="233" width="38" height="14" rx="2" fill="#b0bec5" stroke="#555"/>
  <path d="M890,240 C940,240 940,380 1010,380 H1170" stroke="#222" stroke-width="5" fill="none"/>
  <text x="845" y="145" font-size="12" fill="#33691e" font-weight="600">dockdeel</text>
  <text x="1000" y="372" font-size="11" fill="#333">kabel naar lader</text>

  <!-- maatlijnen pen vs stekker -->
  <line x1="797" y1="200" x2="840" y2="200" stroke="#333" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="1000" y="190" font-size="11.5" fill="#333">pennen steken VERDER uit</text>
  <text x="1000" y="205" font-size="11.5" fill="#333">dan de stekker: eerst</text>
  <text x="1000" y="220" font-size="11.5" fill="#333">uitlijnen, dan pas steken</text>
  <line x1="995" y1="200" x2="842" y2="200" stroke="#999" stroke-dasharray="2,3"/>
  <text x="1000" y="250" font-size="11.5" fill="#333">stekker zit ZWEVEND</text>
  <text x="1000" y="265" font-size="11.5" fill="#333">(TPU/rubber-ring, ±0,5 mm)</text>
  <text x="1000" y="280" font-size="11.5" fill="#333">zodat hij zichzelf centreert</text>
  <line x1="995" y1="255" x2="896" y2="240" stroke="#999" stroke-dasharray="2,3"/>

  <!-- sluitpijlen -->
  <line x1="775" y1="410" x2="700" y2="410" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="785" y1="410" x2="860" y2="410" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="704" y="402" font-size="11.5" fill="#333">magneten trekken samen</text>
  <text x="900" y="414" font-size="11.5" fill="#666">N tegenover Z: klikt maar op één manier</text>

  <!-- ============ PANEEL C: drie stappen bovenaanzicht ============ -->
  <rect x="15" y="445" width="1170" height="370" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="30" y="470" font-weight="700">C. Bovenaanzicht: hoe het dock fouten wegvangt</text>

  <!-- stap 1 -->
  <g>
    <text x="40" y="500" font-weight="600">1. Nadering: scheef en naast de as</text>
    <!-- dock met V-vleugels -->
    <polygon points="270,600 330,560 330,740 270,700" fill="#9ccc65" stroke="#33691e"/>
    <rect x="330" y="560" width="50" height="180" fill="#9ccc65" stroke="#33691e"/>
    <line x1="200" y1="650" x2="360" y2="650" stroke="#999" stroke-dasharray="5,4"/>
    <polygon points="270,600 300,630 300,670 270,700" fill="#fff" stroke="#33691e"/>
    <!-- robot scheef -->
    <g transform="rotate(-10 140 625)">
      <rect x="60" y="600" width="110" height="50" rx="6" fill="#e9e9e9" stroke="#444"/>
      <rect x="170" y="610" width="16" height="30" fill="#f39c3d" stroke="#8a4a00"/>
    </g>
    <text x="40" y="770" font-size="12" fill="#333">afwijking tot ±15 mm opzij en ±10°</text>
    <text x="40" y="786" font-size="11" fill="#666">(zelfde grens als de capture zone in de</text>
    <text x="40" y="801" font-size="11" fill="#666">coop-simulatie: 3 cm breed, 10°)</text>
  </g>

  <!-- stap 2 -->
  <g>
    <text x="420" y="500" font-weight="600">2. V-trechter duwt hem recht</text>
    <polygon points="650,600 710,560 710,740 650,700" fill="#9ccc65" stroke="#33691e"/>
    <rect x="710" y="560" width="50" height="180" fill="#9ccc65" stroke="#33691e"/>
    <polygon points="650,600 680,630 680,670 650,700" fill="#fff" stroke="#33691e"/>
    <g transform="rotate(-3 560 645)">
      <rect x="490" y="623" width="110" height="50" rx="6" fill="#e9e9e9" stroke="#444"/>
      <rect x="600" y="633" width="16" height="30" fill="#f39c3d" stroke="#8a4a00"/>
    </g>
    <path d="M640,612 q8,10 2,20" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="420" y="770" font-size="12" fill="#333">schuine wanden corrigeren grof;</text>
    <text x="420" y="786" font-size="12" fill="#333">pennen in de gaten corrigeren fijn</text>
  </g>

  <!-- stap 3 -->
  <g>
    <text x="800" y="500" font-weight="600">3. Klik: magneten dicht, stekker erin</text>
    <polygon points="1030,600 1090,560 1090,740 1030,700" fill="#9ccc65" stroke="#33691e"/>
    <rect x="1090" y="560" width="50" height="180" fill="#9ccc65" stroke="#33691e"/>
    <polygon points="1030,600 1060,630 1060,670 1030,700" fill="#fff" stroke="#33691e"/>
    <rect x="938" y="625" width="110" height="50" rx="6" fill="#e9e9e9" stroke="#444"/>
    <rect x="1048" y="635" width="16" height="30" fill="#f39c3d" stroke="#8a4a00"/>
    <circle cx="1060" cy="650" r="5" fill="#e53935"/>
    <circle cx="1068" cy="650" r="5" fill="#1e88e5"/>
    <circle cx="1115" cy="585" r="8" fill="#43a047"/>
    <text x="1080" y="575" font-size="11" fill="#2e7d32">laadt</text>
    <text x="800" y="770" font-size="12" fill="#333">robot stopt, magneten houden hem vast,</text>
    <text x="800" y="786" font-size="12" fill="#333">USB-C laadt; achteruit lopen = los</text>
  </g>
</svg>
